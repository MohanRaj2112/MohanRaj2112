<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0e"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#dc2626" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Red Glow Radiance -->
    <radialGradient id="redGlowRight" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="redGlowLeft" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#b91c1c" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#dc2626" stroke-width="0.75" stroke-opacity="0.07"/>
      <circle cx="30" cy="30" r="1" fill="#dc2626" fill-opacity="0.15"/>
    </pattern>

    <!-- Filter for Red Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="900" height="260" rx="16" fill="url(#techGrid)"/>

  <!-- Radial Glow Orbs -->
  <rect width="900" height="260" rx="16" fill="url(#redGlowRight)"/>
  <rect width="900" height="260" rx="16" fill="url(#redGlowLeft)"/>

  <!-- Outer Neon Border -->
  <rect x="1" y="1" width="898" height="258" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Decorative Tech Accents -->
  <g opacity="0.8">
    <circle cx="36" cy="32" r="5" fill="#ef4444" fill-opacity="0.9"/>
    <circle cx="54" cy="32" r="5" fill="#dc2626" fill-opacity="0.4"/>
    <circle cx="72" cy="32" r="5" fill="#991b1b" fill-opacity="0.3"/>
    <text x="96" y="36" fill="#9ca3af" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1">portfolio://mohan-raj/profile</text>
  </g>

  <!-- Geometric Corner Accents -->
  <path d="M 850 25 L 875 25 L 875 50" fill="none" stroke="#dc2626" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 50 235 L 25 235 L 25 210" fill="none" stroke="#dc2626" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Central Name and Content -->
  <g text-anchor="middle" transform="translate(450, 0)">
    <!-- Terminal Tag -->
    <rect x="-140" y="65" width="280" height="26" rx="13" fill="#180a0a" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="82" fill="#ef4444" font-family="'Fira Code', monospace, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2">
      &lt; HELLO WORLD /&gt;
    </text>

    <!-- Main Name -->
    <text x="0" y="142" fill="url(#textGrad)" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="3" filter="drop-shadow(0px 2px 10px rgba(0,0,0,0.8))">
      MOHAN RAJ
    </text>

    <!-- Subtitle / Role -->
    <text x="0" y="174" fill="#f3f4f6" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="1.2">
      Information Technology Student &amp; Developer
    </text>

    <!-- College Tagline -->
    <text x="0" y="198" fill="#9ca3af" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="0.8">
      Adhi College of Engineering and Technology • Class of 2027
    </text>

    <!-- Tech Badges Footer Inside Banner -->
    <g transform="translate(0, 225)">
      <rect x="-240" y="-12" width="480" height="24" rx="12" fill="#111113" stroke="#dc2626" stroke-opacity="0.25" stroke-width="1"/>
      <text x="0" y="4" fill="#f3f4f6" font-family="'Fira Code', monospace, sans-serif" font-size="11" letter-spacing="1">
        <tspan fill="#ef4444">FULL-STACK</tspan> • <tspan fill="#9ca3af">AI/ML LEARNER</tspan> • <tspan fill="#ef4444">DSA</tspan> • <tspan fill="#9ca3af">PROBLEM SOLVER</tspan>
      </text>
    </g>
  </g>
</svg>
